[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrh56"
version = "0.4.0"
description = "Python driver and command-line tools for the Inspire Robots RH56 dexterous hand"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WiseZenn"},
]
keywords = [
    "rh56",
    "dexterous-hand",
    "robotics",
    "serial",
    "inspire-robots",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
pyrh56 = "rh56_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/WiseZenn/pyrh56"
Documentation = "https://github.com/WiseZenn/pyrh56#readme"
Repository = "https://github.com/WiseZenn/pyrh56"
Issues = "https://github.com/WiseZenn/pyrh56/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rh56_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/rh56_sdk",
    "/tests",
    "/examples",
    "/rh56_grasp",
    "/docs",
    "/README.md",
    "/README_CN.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
required-version = ">=0.16,<0.17"
target-version = "py310"

[tool.ruff.lint]
# Keep runtime dependencies minimal while supporting Python 3.10.
typing-extensions = false

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
