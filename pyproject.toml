[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrh56"
version = "0.3.0"
description = "Python driver for the Inspire Robots RH56 dexterous hand"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "WiseZenn"},
]
keywords = [
    "rh56",
    "dexterous-hand",
    "robotics",
    "serial",
    "inspire-robots",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/WiseZenn/pyrh56"
Documentation = "https://github.com/WiseZenn/pyrh56#readme"
Repository = "https://github.com/WiseZenn/pyrh56"
Issues = "https://github.com/WiseZenn/pyrh56/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rh56_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
